<title>Ren Toon Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centred column; the 4:5 render frame is the hero, controls sit under it */
:root{
  --bg:#F6F1EC; --panel:#FFFFFF; --fg:#1C1626; --muted:#6B6176; --line:#E3D9D0; --accent:#C1121F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131D;--panel:#211B29;--fg:#F3EEF6;--muted:#A99FB4;--line:#352C40;--accent:#FF6B6B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17131D;--panel:#211B29;--fg:#F3EEF6;--muted:#A99FB4;--line:#352C40;--accent:#FF6B6B;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
main{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;border:2px solid var(--fg);background:#FFD9A8}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;background:rgba(28,22,38,.78);color:#fff;padding:4px 9px;border-radius:999px;pointer-events:none}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#1C1626}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.controls label span b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--fg);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:0}
code{font-size:12.5px;background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
@media (max-width:420px){.controls{grid-template-columns:1fr}}
</style>

<main>
  <h1>Ren, toon-shaded</h1>
  <p class="sub">Generated from <code>blender/ren_toon.py</code>: the same meshes, palette, cel bands and outlines Blender builds.</p>
  <div class="frame">
    <canvas id="c" aria-label="3D preview of Ren, an original adult anime character in a long coat"></canvas>
    <div class="hint">Drag to orbit · pinch or scroll to zoom</div>
  </div>
  <div class="controls">
    <label for="ow"><span>Outline width <b id="owv">1.0×</b></span><input id="ow" type="range" min="0" max="3" step="0.1" value="1"></label>
    <label for="sh"><span>Shadow amount <b id="shv">0.72</b></span><input id="sh" type="range" min="0.4" max="1" step="0.01" value="0.72"></label>
    <label for="bs"><span>Band split <b id="bsv">0.35</b></span><input id="bs" type="range" min="0.05" max="0.9" step="0.01" value="0.35"></label>
    <label for="la"><span>Sun angle <b id="lav">-35°</b></span><input id="la" type="range" min="-180" max="180" step="1" value="-35"></label>
    <div class="row">
      <button id="face">Face close-up</button>
      <button id="reset">Full body</button>
      <button id="spin" aria-pressed="false">Turntable</button>
      <button id="hl" aria-pressed="true">Highlight band</button>
      <button id="bd" aria-pressed="true">City backdrop</button>
    </div>
  </div>
  <p class="note">Sliders match the <code>STYLE</code> settings at the top of the script. Blender's EEVEE render will look very close to this, but not pixel-identical.</p>
</main>

<script>
(function(){
const frame=document.querySelector(".frame");
if(!window.THREE||!THREE.OrbitControls){frame.insertAdjacentHTML("beforeend",'<div class="err">The 3D library did not load. Check your connection and reload the page.</div>');return;}
const D=JSON.parse(document.getElementById("scene-data").textContent);
const P=D.palette,SH=D.shadow||{},ST=D.style;
const S={shadow:ST.shadow_amount,cool:ST.shadow_hue_shift,split:ST.band_split,hl:ST.highlight,owk:1};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const rgb=h=>{h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);};
function shadeAuto(h,mul,cool){let[r,g,b]=rgb(h);r*=mul;g*=mul;b*=(mul+cool);r=Math.max(0,r-cool*.5);return V(Math.min(r,1),Math.min(g,1),Math.min(b,1));}
const shadowOf=k=>SH[k]?V(...rgb(SH[k])):shadeAuto(P[k],S.shadow,S.cool);

// Blender sun: euler (50°,0,a); direction toward the light, in Blender (Z-up) coords
const L=V(0,0,1);
function setSun(deg){const e=new THREE.Euler(THREE.MathUtils.degToRad(50),0,THREE.MathUtils.degToRad(deg),"XYZ");
  const d=V(0,0,-1).applyEuler(e).negate();L.set(d.x,d.z,-d.y).normalize();}
setSun(-35);

const toonMats=[];
const vsT=`varying vec3 vN;void main(){vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fsT=`uniform vec3 uB,uS,uH,uL;uniform float uSplit,uHL;varying vec3 vN;

const mats={};
function material(o){
  const id=o.mat;if(mats[id])return mats[id];

  if(o.toon){m=new THREE.ShaderMaterial({uniforms:{uB:{value:V(...rgb(P[o.key]))},uS:{value:shadowOf(o.key)},

    vertexShader:vsT,fragmentShader:fsT,side:THREE.DoubleSide});m.userData={key:o.key,hl:o.hl};toonMats.push(m);}

  return mats[id]=m;}

const oVS=`uniform float uW,uK;void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*uW*uK,1.);}`;
const oFS=`uniform vec3 uC;void main(){gl_FragColor=vec4(uC,1.);}`;
const oMats={};
const outlineMat=w=>oMats[w]||(oMats[w]=new THREE.ShaderMaterial({uniforms:{uW:{value:w},uK:uOK,uC:uOC},vertexShader:oVS,fragmentShader:oFS,side:THREE.BackSide}));

const world=new THREE.Group(),ren=new THREE.Group(),city=new THREE.Group();

const CITY=/^(Ground|Building|Window|Sun)/;
for(const o of D.objects){
  const idx=[];for(const f of o.f)for(let k=1;k<f.length-1;k++)idx.push(f[0],f[k],f[k+1]);

  mesh.position.set(...o.loc);if(o.q)mesh.quaternion.set(o.q[1],o.q[2],o.q[3],o.q[0]);
  if(o.ow>0)mesh.add(new THREE.Mesh(g,outlineMat(o.ow)));
  (CITY.test(o.name)?city:ren).add(mesh);
}

const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(P.sky);scene.add(world);
const C=D.camera,b2t=a=>V(a[0],a[2],-a[1]);
const cam=new THREE.PerspectiveCamera(2*Math.atan(18/C.lens)*180/Math.PI,0.8,0.05,100);
const views={full:{pos:b2t(C.location),tgt:b2t(C.target)},face:{pos:V(0.12,1.74,0.75),tgt:V(0,1.72,0)}};
const ctl=new THREE.OrbitControls(cam,canvas);ctl.enableDamping=true;ctl.minDistance=0.3;ctl.maxDistance=12;
function go(v){cam.position.copy(views[v].pos);ctl.target.copy(views[v].tgt);ren.rotation.z=0;ctl.update();}
go("full");
function size(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(size).observe(canvas);size();
let spin=false;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
(function loop(){requestAnimationFrame(loop);if(spin&&!reduce)ren.rotation.z+=0.006;ctl.update();renderer.render(scene,cam);})();

const $=id=>document.getElementById(id);
function refresh(){toonMats.forEach(m=>{m.uniforms.uS.value=shadowOf(m.userData.key);m.uniforms.uSplit.value=S.split;m.uniforms.uHL.value=(S.hl&&m.userData.hl)?1:0;});}
$("ow").oninput=e=>{uOK.value=+e.target.value;$("owv").textContent=(+e.target.value).toFixed(1)+"×";};
$("sh").oninput=e=>{S.shadow=+e.target.value;$("shv").textContent=S.shadow.toFixed(2);refresh();};
$("bs").oninput=e=>{S.split=+e.target.value;$("bsv").textContent=S.split.toFixed(2);refresh();};
$("la").oninput=e=>{setSun(+e.target.value);$("lav").textContent=e.target.value+"°";};
function tog(id,fn){const b=$(id);b.onclick=()=>{const v=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",v);fn(v);};}
tog("hl",v=>{S.hl=v;refresh();});
tog("bd",v=>{city.visible=v;});
tog("spin",v=>{spin=v;if(!v)ren.rotation.z=0;});

$("face").onclick=()=>go("face");
})();
